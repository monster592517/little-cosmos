<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小宇宙 · 全宇宙仿真与论文直达</title>
<meta name="description" content="网页版全宇宙仿真：太阳系 → 邻近恒星系 → 银河系 → 本星系群 → 室女座超星系团 → 可观测宇宙，六个尺度层级拼成完整宇宙。真实星历位置、真实编目天体、全天体 3D 建模，论文直达（arXiv / OpenAlex / Crossref / Semantic Scholar 四源检索 + 中文翻译）">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='6' fill='%23ffcf5c'/><ellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%2367e8f9' stroke-width='1.4' transform='rotate(-22 16 16)'/></svg>">
<link rel="stylesheet" href="./css/app.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "astronomy-engine": "./vendor/astronomy/astronomy.js"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>
<div id="labels" aria-hidden="true"></div>

<!-- 顶栏：视角导航 + 目的地搜索 -->
<header id="topbar">
  <div class="brand">
    <span class="logo"></span>
    <span class="brand-text">小小宇宙<em>Little Cosmos</em></span>
  </div>

  <nav id="scale-nav" aria-label="宇宙尺度导航"></nav>

  <nav id="level-nav" aria-label="视角导航"></nav>

  <div class="dest">
    <input id="dest-input" type="search" placeholder="搜索任意尺度的天体 · 木卫二 / 天狼星 / M31 / 拉尼亚凯亚" autocomplete="off" spellcheck="false">
    <kbd>Ctrl K</kbd>
    <div id="dest-results" class="dest-results" hidden></div>
  </div>

  <div class="actions">
    <button id="zoom-in" class="icon ladder" title="拉近到更小尺度（PageDown）">⤡</button>
    <button id="zoom-out" class="icon ladder" title="拉远到更大尺度（PageUp）">⤢</button>
    <button id="btn-catalog" class="ghost" title="天体目录">目录</button>
    <button id="btn-research" class="ghost" title="论文检索">研究</button>
    <button id="btn-settings" class="ghost" title="设置">设置</button>
    <button id="btn-help" class="ghost" title="帮助">?</button>
  </div>
</header>

<!-- 面包屑 / 视角提示 -->
<div id="crumb"></div>

<!-- 左侧常驻目录（不随导航消失） -->
<aside id="catalog-pane" hidden>
  <div class="panel-head">
    <div>天体目录</div>
    <button id="catalog-close" class="icon" aria-label="收起目录">✕</button>
  </div>
  <div id="catalog-body"></div>
</aside>

<!-- 侧栏面板（天体资料 / 研究 / 设置） -->
<aside id="panel" hidden>
  <div class="panel-head">
    <div id="panel-title">面板</div>
    <button id="panel-close" class="icon" aria-label="关闭">✕</button>
  </div>
  <div id="panel-body"></div>
</aside>

<!-- 底部 HUD：时间与比例 -->
<footer id="hud">
  <div class="hud-group">
    <button id="btn-play" class="icon" title="播放 / 暂停">⏸</button>
    <div id="clock">
      <div id="clock-date">—</div>
      <div id="clock-rate">实时</div>
    </div>
    <select id="speed" title="时间流速">
      <option value="1">实时</option>
      <option value="3600">1 秒 = 1 小时</option>
      <option value="86400" selected>1 秒 = 1 天</option>
      <option value="604800">1 秒 = 1 周</option>
      <option value="2592000">1 秒 = 1 月</option>
      <option value="31557600">1 秒 = 1 年</option>
    </select>
    <button id="btn-now" class="ghost small">回到此刻</button>
  </div>
  <div class="hud-group right">
    <label class="switch" title="镜头缓慢自动旋转">
      <input type="checkbox" id="opt-rotate" checked><span>自动旋转</span>
    </label>
    <label class="switch" title="真实比例：天体大小按实际半径绘制">
      <input type="checkbox" id="scale-true"><span>真实比例</span>
    </label>
    <label class="switch" title="显示轨道线；邻近恒星系层还会显示「有行星」的圆环标记">
      <input type="checkbox" id="opt-orbits" checked><span>轨道</span>
    </label>
    <label class="switch" title="显示名称标签">
      <input type="checkbox" id="opt-labels" checked><span>标签</span>
    </label>
    <span id="scalebar" title="当前视野比例尺"></span>
    <span id="fps"></span>
  </div>
</footer>

<!-- 命令面板 -->
<div id="palette" hidden>
  <div class="palette-box">
    <input id="palette-input" type="text" placeholder="输入目的地或指令…（天体、视角、功能）" autocomplete="off">
    <div id="palette-list"></div>
    <div class="palette-foot">↑↓ 选择 · Enter 前往 · Esc 关闭</div>
  </div>
</div>

<div id="toast"></div>

<!-- 启动画面 -->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-orbit"><i></i><i></i><i></i></div>
    <h1>小小宇宙</h1>
    <p id="boot-status">正在装载星表与行星数据…</p>
    <div class="boot-bar"><i id="boot-progress"></i></div>
  </div>
</div>

<noscript><div style="padding:2rem;color:#fff">本页面需要启用 JavaScript 才能渲染三维宇宙。</div></noscript>

<script type="module" src="./js/main.js"></script>
</body>
</html>
